<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="topFace" x1="16" y1="14" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="16" y1="24" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="32" y1="24" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Isometric Quantum / Next-Gen Tech Cube -->
  <!-- Top Face -->
  <path d="M32 14L48 23.2L32 32.4L16 23.2L32 14Z" fill="url(#topFace)"/>
  
  <!-- Left Face -->
  <path d="M16 24.5L30.5 33V49.5L16 41V24.5Z" fill="url(#leftFace)"/>
  
  <!-- Right Face -->
  <path d="M33.5 33L48 24.5V41L33.5 49.5V33Z" fill="url(#rightFace)"/>

  <!-- Core Circuit Node (Glowing) -->
  <circle cx="32" cy="23.2" r="3.2" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="32" cy="23.2" r="1.6" fill="#0EA5E9"/>

  <!-- Tech Accent Data Pins -->
  <circle cx="48" cy="24.5" r="1.5" fill="#38BDF8"/>
  <circle cx="16" cy="24.5" r="1.5" fill="#38BDF8"/>
  <circle cx="32" cy="50" r="1.5" fill="#818CF8"/>
</svg>